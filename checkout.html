<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout — sendal.id</title>
  <link rel="icon" href="assets/favicon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <div class="container nav">
      <a class="brand" href="index.html"><span class="brand-badge">S</span><span>sendal.id</span></a>
      <nav class="nav-links">
        <a href="index.html#produk">Produk</a>
        <a href="index.html#galeri">Galeri</a>
      </nav>
    </div>
  </header>

  <main class="container section">
    <h1 class="section-title">Checkout</h1>
    <div class="row" style="align-items:flex-start; gap:24px; flex-wrap:wrap">
      <form style="flex:1; min-width:280px; background:white; padding:16px; border-radius:20px; box-shadow: var(--shadow)">
        <div class="row" style="gap:10px">
          <div style="flex:1">
            <label>Nama Lengkap</label>
            <input id="name" required placeholder="Nama kamu" style="width:100%; padding:12px; border-radius:12px; border:1px solid #e5e7eb">
          </div>
          <div style="flex:1">
            <label>Email</label>
            <input id="email" type="email" required placeholder="email@example.com" style="width:100%; padding:12px; border-radius:12px; border:1px solid #e5e7eb">
          </div>
        </div>
        <div style="margin-top:10px">
          <label>Alamat</label>
          <textarea id="address" rows="4" required placeholder="Jalan, Kota, Kode Pos" style="width:100%; padding:12px; border-radius:12px; border:1px solid #e5e7eb"></textarea>
        </div>
        <div style="margin-top:10px">
          <label>Catatan</label>
          <input id="note" placeholder="(opsional)" style="width:100%; padding:12px; border-radius:12px; border:1px solid #e5e7eb">
        </div>
        <button id="pay" class="btn" style="margin-top:14px">Buat Pesanan</button>
        <p class="small">Ini simulasi checkout (tanpa pembayaran).</p>
      </form>

      <aside style="flex:1; min-width:280px; background:white; padding:16px; border-radius:20px; box-shadow: var(--shadow)">
        <h3 style="margin-top:0">Ringkasan Order</h3>
        <div id="checkout-items" class="grid" style="gap:10px"></div>
        <hr style="border:none; border-top:1px solid #eee; margin:10px 0">
        <div class="row" style="justify-content:space-between">
          <strong>Total</strong>
          <strong id="checkout-total">Rp 0</strong>
        </div>
      </aside>
    </div>
  </main>

  <footer class="footer">
    <div class="container small">© sendal.id</div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
